    <style>

<body>
    <div class="app" id="app">
        <aside id="side"></aside>
        <section id="main"></section>
    </div>
    <script>
        (function () {
            var DEFAULTS = ["SPY", "QQQ", "SMH", "IGV", "INTC", "AMD", "META", "AAPL", "NKE", "LULU"];
            var MAX = 20;
            var DEPTHS = [11, 21, 34, 61, 121];
            var KEY = "gex-watchlist";
            var STORE = "gex-feed-v1";
            var DATA_TTL = 12 * 60 * 60 * 1000;
            var ERROR_TTL = 30 * 60 * 1000;
            var memJson = {};
            var inflight = {};
            var state = {
                symbols: loadSymbols(),
                cache: {},
                selected: null,
                expiry: null,
                depth: 61,
                interval: "5m",
                refreshing: false
            };
            var INTERVALS = [
                { id: "5m", label: "5m", yahoo: "5m", range: "5d", window: 78 },
                { id: "15m", label: "15m", yahoo: "15m", range: "1mo", window: 160 },
                { id: "1h", label: "1H", yahoo: "60m", range: "3mo", window: 180 },
                { id: "1d", label: "1D", yahoo: "1d", range: "1y", window: 160 }
            ];
            var chart = { key: "", start: 0, end: 0, priceManual: false, priceMin: 0, priceMax: 0 };
            var chartDraw = function () {};
            var side = document.getElementById("side");
            var main = document.getElementById("main");
            if (!state.selected) state.selected = state.symbols[0] || null;

            function loadSymbols() {
                try {
                    var saved = JSON.parse(localStorage.getItem(KEY));
                    if (Array.isArray(saved) && saved.length) return saved.filter(validSymbol).slice(0, MAX);
                } catch (e) {}
                return DEFAULTS.slice();
            }
            function saveSymbols() { localStorage.setItem(KEY, JSON.stringify(state.symbols)); }
            function validSymbol(s) { return /^[A-Z][A-Z0-9.]{0,9}$/.test(s); }
            function esc(s) {
                return String(s).replace(/[&<>"]/g, function (c) {
                    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
                });
            }
            function formatPx(n) {
                return "US$" + Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }
            function formatPct(n) {
                var v = Number(n);
                if (!isFinite(v)) return "";
                return (v > 0 ? "+" : "") + v.toFixed(2) + "%";
            }
            function formatGex(n) {
                if (!isFinite(n)) return "—";
                var sign = n < 0 ? "-" : "";
                var a = Math.abs(n);
                if (a >= 1e9) return sign + "$" + (a / 1e9).toFixed(2) + "B";
                if (a >= 1e6) return sign + "$" + (a / 1e6).toFixed(1) + "M";
                if (a >= 1e3) return sign + "$" + (a / 1e3).toFixed(1) + "K";
                return sign + "$" + Math.round(a);
            }
            function formatStrike(k) {
                if (k == null || !isFinite(k)) return "—";
                var r = Math.round(k * 1000) / 1000;
                return String(r);
            }
            function addDaysISO(iso, days) {
                var p = iso.split("-").map(Number);
                var dt = new Date(Date.UTC(p[0], p[1] - 1, p[2] + days));
                var m = String(dt.getUTCMonth() + 1).padStart(2, "0");
                var d = String(dt.getUTCDate()).padStart(2, "0");
                return dt.getUTCFullYear() + "-" + m + "-" + d;
            }
            function formatWhen(date) {
                var zone = "America/New_York";
                var day = date.toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: zone });
                var time = date.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: zone, timeZoneName: "short" });
                return day + ", " + time;
            }
            function parseNasdaqAsOf(text) {
                var m = String(text || "").match(/AS OF\s+([A-Za-z]{3})\s+(\d{1,2}),\s+(\d{4})\s+(\d{1,2}):(\d{2})\s*(AM|PM)\s+ET/i);
                if (!m) return null;
                var months = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
                var month = months[m[1].toLowerCase()];
                if (month == null) return null;
                var hour = Number(m[4]) % 12;
                if (m[6].toUpperCase() === "PM") hour += 12;
                var iso = m[3] + "-" + String(month + 1).padStart(2, "0") + "-" + String(Number(m[2])).padStart(2, "0") + "T" + String(hour).padStart(2, "0") + ":" + m[5] + ":00";
                return zonedTime(iso, "America/New_York");
            }
            function zonedTime(iso, timeZone) {
                var bits = iso.split("T");
                var date = bits[0].split("-").map(Number);
                var clock = bits[1].split(":").map(Number);
                var utc = Date.UTC(date[0], date[1] - 1, date[2], clock[0], clock[1] || 0, clock[2] || 0);
                var fmt = new Intl.DateTimeFormat("en-US", {
                    timeZone: timeZone, hourCycle: "h23",
                    year: "numeric", month: "2-digit", day: "2-digit",
                    hour: "2-digit", minute: "2-digit", second: "2-digit"
                });
                var parts = {};
                fmt.formatToParts(new Date(utc)).forEach(function (p) { parts[p.type] = p.value; });
                var shown = Date.UTC(+parts.year, +parts.month - 1, +parts.day, (+parts.hour) % 24, +parts.minute, +parts.second);
                return new Date(utc - (shown - utc));
            }
            function aggregate(snapshot, expiry) {
                var names = expiry ? [expiry] : snapshot.expiries;
                var lo = snapshot.spot * 0.8;
                var hi = snapshot.spot * 1.2;
                var strikes = new Map();
                var net = 0;
                var count = 0;
                names.forEach(function (name) {
                    var bucket = snapshot.byExpiry[name];
                    if (!bucket) return;
                    count += bucket.count;
                    bucket.strikes.forEach(function (row, strike) {
                        if (strike < lo || strike > hi) return;
                        net += row.net;
                        var acc = strikes.get(strike);
                        if (!acc) {
                            acc = { call: 0, put: 0, net: 0 };
                            strikes.set(strike, acc);
                        }
                        acc.call += row.call;
                        acc.put += row.put;
                        acc.net += row.net;
                    });
                });
                var callWall = null, putWall = null, callMax = 0, putMax = 0;
                strikes.forEach(function (row, strike) {
                    if (row.call > callMax) { callMax = row.call; callWall = strike; }
                    if (row.put > putMax) { putMax = row.put; putWall = strike; }
                });
                return { net: net, strikes: strikes, callWall: callWall, putWall: putWall, count: expiry ? (snapshot.byExpiry[expiry] ? snapshot.byExpiry[expiry].count : 0) : snapshot.nonzero };
            }
            function intervalById(id) {
                for (var i = 0; i < INTERVALS.length; i++) if (INTERVALS[i].id === id) return INTERVALS[i];
                return INTERVALS[0];
            }
            function nyToday() {
                return new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
            }
            function money(s) {
                if (s == null) return null;
                var t = String(s).replace(/[$,\s]/g, "");
                if (!t || t === "--") return null;
                var n = parseFloat(t);
                return n === n ? n : null;
            }
            function normPdf(x) { return Math.exp(-0.5 * x * x) / Math.sqrt(2 * Math.PI); }
            function normCdf(x) {
                var ax = Math.abs(x);
                var t = 1 / (1 + 0.2316419 * ax);
                var d = 0.3989422804 * Math.exp(-ax * ax / 2);
                var p = d * t * (0.319381530 + t * (-0.356563782 + t * (1.781477937 + t * (-1.821255978 + t * 1.330274429))));
                return x >= 0 ? 1 - p : p;
            }
            function bsPrice(isCall, S, K, T, r, q, sigma) {
                var vol = sigma * Math.sqrt(T);
                var d1 = (Math.log(S / K) + (r - q + 0.5 * sigma * sigma) * T) / vol;
                var d2 = d1 - vol;
                var dfq = Math.exp(-q * T);
                var dfr = Math.exp(-r * T);
                if (isCall) return S * dfq * normCdf(d1) - K * dfr * normCdf(d2);
                return K * dfr * normCdf(-d2) - S * dfq * normCdf(-d1);
            }
            function impliedVol(isCall, S, K, T, r, q, price) {
                var intrinsic = isCall ? Math.max(S - K, 0) : Math.max(K - S, 0);
                if (!(price > intrinsic + 0.01)) return null;
                var sigma = 0.25;
                for (var i = 0; i < 18; i++) {
                    var vol = sigma * Math.sqrt(T);
                    var d1 = (Math.log(S / K) + (r - q + 0.5 * sigma * sigma) * T) / vol;
                    var diff = bsPrice(isCall, S, K, T, r, q, sigma) - price;
                    var vega = S * Math.exp(-q * T) * normPdf(d1) * Math.sqrt(T);
                    if (Math.abs(diff) < 0.015) return sigma;
                    if (vega < 1e-5) break;
                    sigma -= diff / vega;
                    if (sigma < 0.02) sigma = 0.02;
                    if (sigma > 4) sigma = 4;
                }
                return sigma > 0.02 && sigma < 4 ? sigma : null;
            }
            function contractGamma(S, K, T, r, q, sigma) {
                var vol = sigma * Math.sqrt(T);
                var d1 = (Math.log(S / K) + (r - q + 0.5 * sigma * sigma) * T) / vol;
                return Math.exp(-q * T) * normPdf(d1) / (S * sigma * Math.sqrt(T));
            }
            function readStore() {
                try { return JSON.parse(localStorage.getItem(STORE)) || {}; }
                catch (e) { return {}; }
            }
            function writeStore(data) {
                try {
                    localStorage.setItem(STORE, JSON.stringify(data));
                } catch (e) {
                    var slim = {};
                    Object.keys(data).forEach(function (k) {
                        slim[k] = { savedAt: data[k].savedAt, snapshot: data[k].snapshot, series: {}, chainError: data[k].chainError };
                    });
                    try { localStorage.setItem(STORE, JSON.stringify(slim)); } catch (err) {}
                }
            }
            function packSnapshot(s) {
                if (!s) return null;
                var byExpiry = {};
                Object.keys(s.byExpiry || {}).forEach(function (exp) {
                    var bucket = s.byExpiry[exp];
                    byExpiry[exp] = { count: bucket.count, strikes: Array.from(bucket.strikes.entries()) };
                });
                return {
                    symbol: s.symbol,
                    spot: s.spot,
                    changePct: s.changePct,
                    priceTime: s.priceTime ? s.priceTime.getTime() : null,
                    gexTime: s.gexTime ? s.gexTime.getTime() : null,
                    nonzero: s.nonzero,
                    expiries: s.expiries,
                    byExpiry: byExpiry,
                    pending: false,
                    chainError: !!s.chainError,
                    div: s.div
                };
            }
            function unpackSnapshot(s) {
                if (!s) return null;
                var byExpiry = {};
                Object.keys(s.byExpiry || {}).forEach(function (exp) {
                    var bucket = s.byExpiry[exp];
                    byExpiry[exp] = { count: bucket.count, strikes: new Map(bucket.strikes || []) };
                });
                return {
                    symbol: s.symbol,
                    spot: s.spot,
                    changePct: s.changePct,
                    priceTime: s.priceTime ? new Date(s.priceTime) : null,
                    gexTime: s.gexTime ? new Date(s.gexTime) : null,
                    nonzero: s.nonzero,
                    expiries: s.expiries || [],
                    byExpiry: byExpiry,
                    pending: false,
                    chainError: !!s.chainError,
                    div: s.div
                };
            }
            function isFresh(symbol) {
                var item = state.cache[symbol];
                if (!item || !item.savedAt || !item.snapshot || item.snapshot.pending) return false;
                var ttl = item.chainError ? ERROR_TTL : DATA_TTL;
                return Date.now() - item.savedAt < ttl;
            }
            function persistSymbol(symbol) {
                var item = state.cache[symbol];
                if (!item || !item.snapshot || item.snapshot.pending || !item.savedAt) return;
                var all = readStore();
                all[symbol] = {
                    savedAt: item.savedAt,
                    snapshot: packSnapshot(item.snapshot),
                    series: item.series || {},
                    chainError: !!item.chainError
                };
                writeStore(all);
            }
            function hydrate() {
                var all = readStore();
                state.symbols.forEach(function (symbol) {
                    var entry = all[symbol];
                    if (!entry || !entry.savedAt || !entry.snapshot) return;
                    var ttl = entry.chainError ? ERROR_TTL : DATA_TTL;
                    if (Date.now() - entry.savedAt >= ttl) return;
                    state.cache[symbol] = {
                        status: "ready",
                        snapshot: unpackSnapshot(entry.snapshot),
                        series: entry.series || {},
                        chainError: !!entry.chainError,
                        savedAt: entry.savedAt
                    };
                });
            }
            async function fetchJsonNet(url, attempt, tolerance) {

                        maxVol = Math.max(maxVol, c.v || 0);
                    });
                    var pad = (max - min) * 0.08 || 1;
                    if (!(chart.priceManual && chart.priceMax > chart.priceMin)) {
                        min -= pad;
                        max += pad;
                    } else {
                        min = chart.priceMin;
                        max = chart.priceMax;
                    }
                    geom = { left: left, right: right, top: top, bottom: bottom, min: min, max: max };
                    function y(p) { return top + (max - p) / (max - min) * (bottom - top); }
                    function xAt(i) { return left + (i - chart.start + 0.5) * (right - left) / (chart.end - chart.start); }
                    ctx.font = "11px Inter, sans-serif";
                    ctx.textBaseline = "middle";
                    ctx.strokeStyle = "#23282f";
                    ctx.fillStyle = "#8b919a";
                    for (var g = 0; g < 4; g++) {
                        var price = max - (max - min) * g / 3;
                        var yy = y(price);
                        ctx.beginPath();
                        ctx.moveTo(left, yy);
                        ctx.lineTo(right, yy);
                        ctx.stroke();
                        ctx.fillText(price.toFixed(price >= 1000 ? 0 : 2), right + 8, yy);
                    }
                    function wall(price, color, label) {
                        if (price == null || price < min || price > max) return;
                        var yy = y(price);
                        ctx.save();
                        ctx.strokeStyle = color;
                        ctx.setLineDash([4, 3]);
                        ctx.beginPath();
                        ctx.moveTo(left, yy);
                        ctx.lineTo(right, yy);
                        ctx.stroke();
                        ctx.setLineDash([]);
                        ctx.fillStyle = color;
                        ctx.fillText(label, left + 4, yy - 8);
                        ctx.restore();
                    }
                    wall(callWall, "#c6f135", "Call " + formatStrike(callWall));
                    wall(putWall, "#ff6b6b", "Put " + formatStrike(putWall));
                    var slot = (right - left) / (chart.end - chart.start);
                    var body = Math.max(1, slot * 0.62);
                    for (var n = Math.floor(chart.start); n < Math.min(bars.length, Math.ceil(chart.end)); n++) {
                        var c = bars[n];
                        var up = c.c >= c.o;
                        var color = up ? "#c6f135" : "#ff6b6b";
                        var x = xAt(n);
                        ctx.strokeStyle = color;
                        ctx.fillStyle = color;
                        ctx.beginPath();
                        ctx.moveTo(x, y(c.h));
                        ctx.lineTo(x, y(c.l));
                        ctx.stroke();
                        var y1 = y(Math.max(c.o, c.c));
                        var y2 = y(Math.min(c.o, c.c));
                        ctx.fillRect(x - body / 2, y1, body, Math.max(1, y2 - y1));
                        if (maxVol) {
                            var vh = (c.v || 0) / maxVol * (volH - 8);
                            ctx.globalAlpha = 0.45;
                            ctx.fillRect(x - body / 2, h - axis - vh, body, vh);
                            ctx.globalAlpha = 1;
                        }
                    }
                    var last = bars[bars.length - 1];
                    var lastY = y(last.c);
                    if (lastY >= top && lastY <= bottom) {
                        ctx.strokeStyle = last.c >= last.o ? "#c6f135" : "#ff6b6b";
                        ctx.setLineDash([2, 3]);
                        ctx.beginPath();
                        ctx.moveTo(left, lastY);
                        ctx.lineTo(right, lastY);
                        ctx.stroke();
                        ctx.setLineDash([]);
                        ctx.fillStyle = last.c >= last.o ? "#c6f135" : "#ff6b6b";
                        ctx.fillRect(right, lastY - 8, 58, 16);
                        ctx.fillStyle = "#111";
                        ctx.fillText(last.c.toFixed(2), right + 4, lastY);
                    }
                    ctx.fillStyle = "#8b919a";
                    ctx.textBaseline = "alphabetic";
                    var lastLabelX = -999;
                    var prevT = null;
                    var step = Math.max(1, Math.ceil((chart.end - chart.start) / 8));
                    for (var t = Math.ceil(chart.start); t < Math.min(bars.length, chart.end); t += step) {
                        var lx = xAt(t);
                        if (lx - lastLabelX < 76) continue;
                        ctx.fillText(axisTime(bars[t].t, prevT), lx - 16, h - 6);
                        lastLabelX = lx;
                        prevT = bars[t].t;
                    }
                    var bar = hover != null ? bars[hover] : last;
                    if (hover == null) {
                        for (var b = bars.length - 1; b >= 0; b--) {
                            if (bars[b].v > 0) { bar = bars[b]; break; }
                        }
                    }
                    if (legend && bar) {
                        var upBar = bar.c >= bar.o;
                        legend.innerHTML = '<span>' + formatBarTime(bar.t) + '</span>' +
                            '<span>O <b class="' + (upBar ? "up" : "down") + '">' + bar.o.toFixed(2) + '</b></span>' +
                            '<span>H <b>' + bar.h.toFixed(2) + '</b></span>' +
                            '<span>L <b>' + bar.l.toFixed(2) + '</b></span>' +
                            '<span>C <b class="' + (upBar ? "up" : "down") + '">' + bar.c.toFixed(2) + '</b></span>' +
                            '<span>Vol <b>' + formatVol(bar.v) + '</b></span>';
                    }
                    if (hover != null && hover >= Math.floor(chart.start) && hover < chart.end) {
                        var hx = xAt(hover);
                        var hy = y(bars[hover].c);
                        ctx.strokeStyle = "#9aa1ab";
                        ctx.setLineDash([3, 3]);
                        ctx.beginPath();
                        ctx.moveTo(hx, top);
                        ctx.lineTo(hx, h - axis);
                        ctx.moveTo(left, hy);
                        ctx.lineTo(right, hy);
                        ctx.stroke();
                        ctx.setLineDash([]);
                        ctx.fillStyle = "#e8eaed";
                        ctx.fillRect(right, hy - 8, 58, 16);
                        ctx.fillStyle = "#111";
                        ctx.textBaseline = "middle";
                        ctx.fillText(bars[hover].c.toFixed(2), right + 4, hy);
                    }
                }
                function indexAt(clientX) {
                    var rect = canvas.getBoundingClientRect();
                    var x = clientX - rect.left;
                    var left = 8, right = canvas.clientWidth - 64;
                    var idx = Math.floor(chart.start + (x - left) / Math.max(1, right - left) * (chart.end - chart.start));
                    if (idx < 0 || idx >= bars.length) return null;
                    return idx;
                }
                function localPoint(e) {
                    var rect = canvas.getBoundingClientRect();
                    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
                }
                function onPriceScale(pt) {
                    return pt.x >= geom.right && pt.y >= geom.top && pt.y <= geom.bottom;
                }
                function priceAt(y) {
                    var span = geom.bottom - geom.top;
                    if (!(span > 0)) return geom.max;
                    return geom.max - (y - geom.top) / span * (geom.max - geom.min);
                }
                function setPrice(min, max) {
                    if (!(max > min)) return;
                    var span = max - min;
                    var mid = (max + min) / 2;
                    var floor = Math.max(Math.abs(mid) * 0.0008, 0.05);
                    var cap = Math.max(Math.abs(mid) * 8, span);
                    if (span < floor) {
                        min = mid - floor / 2;
                        max = mid + floor / 2;
                    } else if (span > cap) {
                        min = mid - cap / 2;
                        max = mid + cap / 2;
                    }
                    chart.priceMin = min;
                    chart.priceMax = max;
                    chart.priceManual = true;
                }
                canvas.onwheel = function (e) {
                    e.preventDefault();
                    var pt = localPoint(e);
                    if (onPriceScale(pt)) {
                        var anchor = priceAt(pt.y);
                        var frac = (geom.bottom - pt.y) / Math.max(1, geom.bottom - geom.top);
                        var span = geom.max - geom.min;
                        var next = span * (e.deltaY > 0 ? 1.12 : 0.88);
                        setPrice(anchor - frac * next, anchor + (1 - frac) * next);
                    } else {
                        var left = geom.left, right = geom.right;
                        var fracT = Math.min(1, Math.max(0, (pt.x - left) / Math.max(1, right - left)));
                        var spanT = chart.end - chart.start;
                        var nextT = Math.max(12, Math.min(bars.length + 5, spanT * (e.deltaY > 0 ? 1.18 : 0.82)));
                        var anchorT = chart.start + fracT * spanT;
                        chart.start = anchorT - fracT * nextT;
                        chart.end = chart.start + nextT;
                    }
                    draw();
                };
                canvas.onpointerdown = function (e) {
                    var pt = localPoint(e);
                    if (onPriceScale(pt)) {
                        var frac = (pt.y - geom.top) / Math.max(1, geom.bottom - geom.top);
                        drag = { kind: "scale", y: pt.y, min: geom.min, max: geom.max, anchor: priceAt(pt.y), frac: frac };
                        canvas.style.cursor = "ns-resize";
                    } else {
                        drag = { kind: "pan", x: e.clientX, y: pt.y, start: chart.start, end: chart.end, min: geom.min, max: geom.max };
                    }
                    canvas.setPointerCapture(e.pointerId);
                };
                canvas.onpointermove = function (e) {
                    var pt = localPoint(e);
                    hover = onPriceScale(pt) ? null : indexAt(e.clientX);
                    canvas.style.cursor = onPriceScale(pt) || (drag && drag.kind === "scale") ? "ns-resize" : "crosshair";
                    if (drag && drag.kind === "scale") {
                        var plotH = Math.max(1, geom.bottom - geom.top);
                        var factor = Math.exp((pt.y - drag.y) / (plotH * 0.72));
                        var span = (drag.max - drag.min) * factor;
                        var anchor = drag.anchor;
                        setPrice(anchor - (1 - drag.frac) * span, anchor + drag.frac * span);
                    } else if (drag && drag.kind === "pan") {
                        var slot = (geom.right - geom.left) / Math.max(1, drag.end - drag.start);
                        var shift = (drag.x - e.clientX) / Math.max(1, slot);
                        var spanT = drag.end - drag.start;
                        chart.start = drag.start + shift;
                        chart.end = chart.start + spanT;
                        var plotH = Math.max(1, geom.bottom - geom.top);
                        var priceShift = (pt.y - drag.y) / plotH * (drag.max - drag.min);
                        setPrice(drag.min + priceShift, drag.max + priceShift);
                    }
                    draw();
                };
                canvas.onpointerup = function () { drag = null; };
                canvas.onlostpointercapture = function () { drag = null; };
                canvas.onpointerleave = function () {
                    if (drag) return;
                    hover = null;
                    canvas.style.cursor = "crosshair";
                    draw();
                };
                canvas.ondblclick = function (e) {
                    var pt = localPoint(e);
                    chart.priceManual = false;
                    if (!onPriceScale(pt)) {
                        var win = defaultWindow(bars.length);
                        chart.start = win.start;
                        chart.end = win.end;
                    }
                    draw();
                };
                chartDraw = draw;
                draw();
            }

            document.getElementById("app").addEventListener("click", function (e) {
                var el = e.target.closest("[data-act]");
                if (!el) return;
                var act = el.getAttribute("data-act");
                if (act === "refresh") refreshAll(true);
                if (act === "open") {
                    state.selected = el.getAttribute("data-sym");
                    state.expiry = null;
                    render({ keepSide: true });
                }
                if (act === "remove") {
                    var symRemove = el.getAttribute("data-sym");
                    var removedCurrent = state.selected === symRemove;
                    state.symbols = state.symbols.filter(function (s) { return s !== symRemove; });
                    delete state.cache[symRemove];
                    if (removedCurrent) state.selected = state.symbols[0] || null;
                    saveSymbols();
                    render({ keepSide: true, keepMain: !removedCurrent });
                }
                if (act === "menu") {
                    var menu = document.getElementById("expMenu");
                    if (menu) menu.hidden = !menu.hidden;
                }
                if (act === "expiry") {
                    state.expiry = el.getAttribute("data-exp") || null;
                    render({ keepSide: true, keepMain: true });
                }
                if (act === "depth") {
                    state.depth = Number(el.getAttribute("data-n"));
                    render({ keepSide: true, keepMain: true });
                }
                if (act === "interval") {
                    var iv = el.getAttribute("data-iv");
                    if (!iv || iv === state.interval || !state.selected) return;
                    state.interval = iv;
                    chart.key = "";
                    ensureSeries(state.selected, iv);
                }
            });
            document.getElementById("app").addEventListener("submit", function (e) {
                if (e.target.id !== "addForm") return;
                e.preventDefault();
                var input = document.getElementById("addInput");
                var symbol = input.value.trim().toUpperCase();
                if (!validSymbol(symbol) || state.symbols.indexOf(symbol) !== -1 || state.symbols.length >= MAX) return;
                state.symbols.push(symbol);
                saveSymbols();
                loadSymbol(symbol);
            });
            document.addEventListener("click", function (e) {
                var menu = document.getElementById("expMenu");
                if (!menu || menu.hidden) return;
                if (!e.target.closest(".expiry")) menu.hidden = true;
            });
            window.addEventListener("resize", function () { chartDraw(); });

            hydrate();
            render();
            refreshAll();
        })();
    </script>
</body>
</html>
