<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEX Dashboard | Gamma exposure by ticker</title>
    <meta name="description" content="Watchlist of gamma exposure with a strike-by-strike column view. Refresh delayed CBOE data, then open a ticker for call and put walls and net gamma by strike.">
    <meta name="author" content="Manan Patel">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mananpatel.info/tools/gex-dashboard.html">
    <meta property="og:title" content="GEX Dashboard">
    <meta property="og:description" content="Gamma exposure, call and put walls, and a strike-by-strike column view. Delayed CBOE data.">
    <meta property="og:site_name" content="Manan Patel">
    <link rel="canonical" href="https://mananpatel.info/tools/gex-dashboard.html">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; background: #070809; color: #f3f4f6; }
        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-variant-numeric: tabular-nums;
        }
        button, input { font: inherit; color: inherit; }
        button { cursor: pointer; }
        .app {
            display: grid;
            grid-template-columns: 320px minmax(0, 1fr);
            height: 100vh;
            background: #0c0e12;
        }
        aside {
            min-height: 0;
            overflow: auto;
            border-right: 1px solid #23272e;
            padding: 22px 16px 24px;
        }
        .brand { margin: 0; font-size: 1.15rem; font-weight: 700; letter-spacing: -0.03em; }
        .home { display: inline-block; margin: 8px 0 18px; color: #c5cad1; text-decoration: none; font-size: 0.88rem; }
        .home:hover { color: #fff; }
        #main {
            min-height: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 22px 28px 18px;
        }
        .wl-head, .controls, .section-sub, .head {
            display: flex; justify-content: space-between; gap: 12px; align-items: flex-end;
        }
        .kicker {
            margin: 0; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: #9aa1ab;
        }
        .count { margin: 2px 0 0; color: #c5cad1; font-size: 0.92rem; }
        .refresh {
            border: 0; background: #c6f135; color: #111; font-weight: 700;
            border-radius: 999px; padding: 10px 14px; display: inline-flex; align-items: center; gap: 6px;
        }
        .refresh svg { width: 16px; height: 16px; }
        .refresh.busy svg { animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(-360deg); } }
        .ticker {
            display: flex; align-items: center; gap: 4px;
            padding: 8px 8px; border-radius: 10px; margin: 0 -8px;
        }
        .ticker.on { background: #171b20; }
        .ticker-open {
            flex: 1; display: flex; justify-content: space-between; gap: 12px;
            text-align: left; background: none; border: 0; padding: 4px 0; min-width: 0;
        }
        .t-sym { font-weight: 750; font-size: 1.02rem; }
        .t-sub { margin-top: 3px; color: #9aa1ab; font-size: 0.82rem; }
        .t-times { margin-top: 2px; color: #6f7680; font-size: 0.72rem; line-height: 1.35; }
        .t-quote { text-align: right; }
        .t-px { font-weight: 650; }
        .up { color: #b6ef3c; }
        .down { color: #ff5d5d; }
        .muted { color: #9aa1ab; }
        .remove {
            background: none; border: 0; color: #6b7280; font-size: 1rem; line-height: 1;
            padding: 6px; border-radius: 6px;
        }
        .remove:hover { color: #fff; background: #23272e; }
        .ticker-actions { display: flex; flex-direction: column; align-items: center; }
        .columns-btn {
            background: none; border: 0; color: #c6f135; font-size: 0.68rem; font-weight: 750;
            letter-spacing: 0.02em; padding: 4px 2px; text-decoration: underline; text-underline-offset: 2px;
        }
        .columns-btn:hover { color: #fff; }
        .notice {
            margin: 12px 0 0; padding: 9px 11px; border-radius: 8px;
            background: #171b20; color: #d5d8de; font-size: 0.82rem; line-height: 1.4;
        }
        .add { display: flex; gap: 8px; margin-top: 16px; }
        .add input {
            flex: 1; background: #15181d; border: 1px solid #2a2f36; border-radius: 10px;
            padding: 11px 12px; outline: none;
        }
        .add button {
            border: 0; background: #1c2128; border-radius: 10px; padding: 0 14px; font-weight: 650;
        }
        .head { align-items: flex-start; margin-top: 8px; }
        .sym { margin: 2px 0 0; font-size: 2.4rem; font-weight: 700; letter-spacing: -0.04em; line-height: 1; }
        .quote { text-align: right; }
        .px { font-size: 1.55rem; font-weight: 700; letter-spacing: -0.03em; }
        .chg { margin-top: 4px; font-weight: 650; }
        .meta { margin: 10px 0 0; color: #9aa1ab; font-size: 0.92rem; line-height: 1.45; }
        h2 { margin: 16px 0 0; font-size: 1.15rem; letter-spacing: -0.03em; }
        .section-sub { margin-top: 6px; color: #9aa1ab; font-size: 0.88rem; align-items: flex-start; }
        .section-sub span:last-child { white-space: nowrap; }
        .stage {
            display: grid;
            grid-template-columns: minmax(0, 1.65fr) minmax(280px, 0.7fr);
            gap: 28px;
            flex: 1;
            min-height: 0;
        }
        .col { min-height: 0; min-width: 0; display: flex; flex-direction: column; }
        .chart-toolbar { display: flex; justify-content: space-between; gap: 12px; align-items: flex-end; margin-top: 18px; }
        .chart-toolbar h2 { margin: 0; }
        .intervals { display: flex; gap: 4px; }
        .intervals button {
            background: #171b20; border: 0; color: #c5cad1; border-radius: 8px; padding: 6px 9px;
        }
        .intervals button.on { background: #c6f135; color: #111; font-weight: 750; }
        .chart-box { position: relative; flex: 1; min-height: 280px; }
        .chart-legend {
            position: absolute; z-index: 2; left: 10px; top: 8px; right: 72px;
            display: flex; flex-wrap: wrap; gap: 8px 12px;
            font-size: 12px; color: #d5d8de; pointer-events: none;
        }
        .chart-legend b { font-weight: 650; }
        canvas { width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
        .gex-scroll { flex: 1; min-height: 0; overflow: auto; margin-top: 8px; }
        .empty { color: #9aa1ab; padding-top: 12vh; font-size: 1.05rem; }
        .stats {
            display: grid; grid-template-columns: 1fr 1fr 1fr;
            margin-top: 18px; border-top: 1px solid #2a2f36; border-bottom: 1px solid #2a2f36;
        }
        .stat { padding: 14px 10px; }
        .stat + .stat { border-left: 1px solid #2a2f36; }
        .stat p { margin: 0; color: #9aa1ab; font-size: 0.88rem; }
        .stat strong { display: block; margin-top: 8px; font-size: 1.45rem; font-weight: 700; }
        .controls { align-items: flex-end; margin-top: 0; gap: 10px; }
        .control-label { margin: 0 0 6px; color: #9aa1ab; font-size: 0.78rem; }
        .expiry { position: relative; }
        .expiry-btn, .depths {
            background: #171b20; border: 0; border-radius: 12px; color: #fff;
        }
        .expiry-btn { padding: 10px 12px; display: inline-flex; align-items: center; gap: 8px; text-align: left; }
        .menu {
            position: absolute; z-index: 6; top: calc(100% + 6px); left: 0; min-width: 240px;
            max-height: 320px; overflow: auto; background: #1b2026; border-radius: 14px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.45); padding: 6px;
        }
        .menu[hidden] { display: none; }
        .menu button {
            display: flex; justify-content: space-between; gap: 12px; width: 100%;
            background: none; border: 0; text-align: left; padding: 9px 10px; border-radius: 8px; color: #d5d8de;
        }
        .menu button.on, .menu button:hover { background: #111418; color: #fff; }
        .depths { display: flex; padding: 3px; }
        .depths button { background: none; border: 0; color: #c5cad1; border-radius: 9px; padding: 7px 9px; }
        .depths button.on { background: #c6f135; color: #111; font-weight: 750; }
        .chart-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-end; margin-top: 22px; }
        .chart-head h2 { margin: 0; }
        .chart-note { margin: 4px 0 0; color: #9aa1ab; font-size: 0.82rem; }
        .unit { color: #9aa1ab; font-size: 0.78rem; white-space: nowrap; }
        .gex-chart { margin-top: 0; }
        .gex-row { display: grid; grid-template-columns: 42px 1fr; align-items: center; height: 18px; }
        .ylab { color: #8b919a; font-size: 0.72rem; }
        .track { position: relative; height: 14px; }
        .zero { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: #3a414b; }
        .bar { position: absolute; top: 3px; height: 8px; }
        .bar.pos { left: 50%; background: #c6f135; }
        .bar.neg { right: 50%; background: #ff6b6b; }
        .gex-row.wall-call .track::after,
        .gex-row.wall-put .track::after,
        .gex-row.spot .track::before {
            content: ""; position: absolute; left: 0; right: 0; top: 50%;
        }
        .gex-row.wall-call .track::after { border-top: 1px dashed #c6f135; }
        .gex-row.wall-put .track::after { border-top: 1px dashed #ff6b6b; }
        .gex-row.spot .track::before { border-top: 1px solid #f5c518; z-index: 1; }
        .axis { display: flex; justify-content: space-between; color: #8b919a; font-size: 0.75rem; margin: 6px 0 0 42px; }
        .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 16px; color: #c5cad1; font-size: 0.82rem; }
        .legend span { display: inline-flex; align-items: center; gap: 6px; }
        .sw { width: 18px; height: 4px; border-radius: 1px; background: #c6f135; }
        .sw.neg { background: #ff6b6b; }
        .sw.spot { background: #f5c518; }
        .method { margin-top: 8px; border-top: 1px solid #2a2f36; }
        .method summary { cursor: pointer; font-weight: 700; padding: 14px 0; }
        .method p { margin: 0 0 12px; color: #b7bdc6; line-height: 1.5; font-size: 0.92rem; }
        .err { color: #ff8d8d; font-size: 0.82rem; margin-top: 8px; }
        .ladder-overlay {
            position: fixed; inset: 0; z-index: 20; display: flex; justify-content: flex-end;
            background: rgba(2, 4, 8, 0.72);
        }
        .ladder-drawer {
            width: min(760px, 100%); height: 100dvh; min-width: 0; display: flex; flex-direction: column;
            overflow: hidden; background: #101125; color: #f2f3ff; box-shadow: -18px 0 50px rgba(0, 0, 0, 0.5);
        }
        .ladder-titlebar {
            flex: 0 0 auto; min-height: 66px; display: flex; align-items: center; justify-content: space-between;
            gap: 12px; padding: max(12px, env(safe-area-inset-top)) 14px 10px; border-bottom: 1px solid #303250;
        }
        .ladder-titlebar h2 { margin: 2px 0 0; font-size: 1.25rem; letter-spacing: -0.02em; }
        .ladder-kicker { margin: 0; color: #8f94b1; font-size: 0.68rem; font-weight: 750; letter-spacing: 0.14em; }
        .ladder-close {
            width: 42px; height: 42px; flex: 0 0 auto; border: 1px solid #3a3d60; border-radius: 7px;
            background: #191b35; color: #fff; font-size: 1.7rem; line-height: 1;
        }
        .ladder-empty {
            min-height: 200px; display: flex; align-items: center; justify-content: center;
            color: #a6aac2; text-align: center; padding: 24px;
        }
        .expiry-tabs {
            flex: 0 0 auto; max-height: 94px; display: flex; flex-wrap: wrap; gap: 5px; overflow-y: auto;
            padding: 8px 12px; border-bottom: 1px solid #303250;
        }
        .expiry-tabs button {
            min-width: 58px; min-height: 36px; display: flex; align-items: baseline; justify-content: center; gap: 4px;
            border: 1px solid #353858; border-radius: 5px; background: #17182d; color: #9da2bd; padding: 5px 7px;
        }
        .expiry-tabs button.on { border-color: #5ae5b4; background: #243c42; color: #eafff8; }
        .expiry-tabs button b { font-size: 0.72rem; }
        .expiry-tabs button span { font-size: 0.62rem; }
        .ladder-panel { min-height: 0; display: flex; flex: 1 1 auto; flex-direction: column; }
        .ladder-meta {
            flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px;
            padding: 9px 12px; border-bottom: 1px solid #303250; color: #8f94b1;
            font-size: 0.68rem; font-variant-numeric: tabular-nums;
        }
        .ladder-meta > div { display: flex; flex-wrap: wrap; gap: 7px 12px; }
        .ladder-meta > div:last-child { justify-content: flex-end; color: #55dda8; }
        .ladder-meta b { color: #f3f4ff; font-weight: 700; }
        .ladder-scroll { min-height: 0; flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; }
        .ladder-grid { position: relative; min-width: 286px; font-size: 0.68rem; font-variant-numeric: tabular-nums; }
        .ladder-columns, .ladder-row { display: grid; grid-template-columns: 62px repeat(4, minmax(54px, 1fr)); }
        .ladder-columns {
            position: sticky; top: 0; z-index: 2; height: 28px; align-items: center; background: #121329;
            border-bottom: 1px solid #3a3d60; color: #969bb7; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.04em;
        }
        .ladder-columns span { padding: 0 6px; text-align: right; }
        .ladder-columns span:first-child { text-align: left; }
        .ladder-row { height: 26px; }
        .ladder-row > span {
            min-width: 0; display: flex; align-items: center; justify-content: flex-end; padding: 0 6px;
            border-right: 1px solid #2f3150; border-bottom: 1px solid #272943; overflow: hidden; white-space: nowrap;
        }
        .ladder-row > span:last-child { border-right: 0; }
        .ladder-strike {
            position: relative; justify-content: flex-start; gap: 3px; background: #1a1b35; color: #d9dbee;
        }
        .ladder-strike i { color: #fff; font-style: normal; }
        .spot-marker {
            position: absolute; z-index: 3; left: 0; right: 0; height: 0; border-top: 2px solid #fff;
            pointer-events: none;
        }
        .spot-marker span {
            position: absolute; left: 0; top: -10px; padding: 1px 4px 1px 2px; background: #fff; color: #101125;
            font-weight: 800; font-size: 0.62rem; line-height: 16px;
        }
        .ladder-footnote {
            flex: 0 0 auto; padding: 7px 12px calc(7px + env(safe-area-inset-bottom));
            border-top: 1px solid #303250; color: #858aa8; font-size: 0.62rem; text-align: right;
        }
    </style>
</head>
<body>
    <div class="app" id="app">
        <aside id="side"></aside>
        <section id="main"></section>
        <div id="ladder"></div>
    </div>
    <script>
        (function () {
            var DEFAULTS = ["SPY", "QQQ", "SMH", "IGV", "INTC", "AMD", "META", "AAPL", "NKE", "LULU"];
            var MAX = 20;
            var DEPTHS = [11, 21, 34, 61, 121];
            var KEY = "gex-watchlist";
            var STORE = "gex-feed-v2";
            var DATA_TTL = 12 * 60 * 60 * 1000;
            var ERROR_TTL = 30 * 60 * 1000;
            var memJson = {};
            var inflight = {};
            var state = {
                symbols: loadSymbols(),
                cache: {},
                selected: null,
                expiry: null,
                depth: 61,
                interval: "5m",
                refreshing: false,
                ladder: null,
                ladderExpiry: "",
                notice: ""
            };
            var INTERVALS = [
                { id: "5m", label: "5m", yahoo: "5m", range: "5d", window: 78 },
                { id: "15m", label: "15m", yahoo: "15m", range: "1mo", window: 160 },
                { id: "1h", label: "1H", yahoo: "60m", range: "3mo", window: 180 },
                { id: "1d", label: "1D", yahoo: "1d", range: "1y", window: 160 }
            ];
            var chart = { key: "", start: 0, end: 0, priceManual: false, priceMin: 0, priceMax: 0 };
            var chartDraw = function () {};
            var side = document.getElementById("side");
            var main = document.getElementById("main");
            if (!state.selected) state.selected = state.symbols[0] || null;

            function loadSymbols() {
                try {
                    var saved = JSON.parse(localStorage.getItem(KEY));
                    if (Array.isArray(saved) && saved.length) return saved.filter(validSymbol).slice(0, MAX);
                } catch (e) {}
                return DEFAULTS.slice();
            }
            function saveSymbols() { localStorage.setItem(KEY, JSON.stringify(state.symbols)); }
            function validSymbol(s) { return /^[A-Z][A-Z0-9.]{0,9}$/.test(s); }
            function esc(s) {
                return String(s).replace(/[&<>"]/g, function (c) {
                    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
                });
            }
            function formatPx(n) {
                return "US$" + Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }
            function formatPct(n) {
                var v = Number(n);
                if (!isFinite(v)) return "";
                return (v > 0 ? "+" : "") + v.toFixed(2) + "%";
            }
            function formatGex(n) {
                if (!isFinite(n)) return "—";
                var sign = n < 0 ? "-" : "";
                var a = Math.abs(n);
                if (a >= 1e9) return sign + "$" + (a / 1e9).toFixed(2) + "B";
                if (a >= 1e6) return sign + "$" + (a / 1e6).toFixed(1) + "M";
                if (a >= 1e3) return sign + "$" + (a / 1e3).toFixed(1) + "K";
                return sign + "$" + Math.round(a);
            }
            function formatStrike(k) {
                if (k == null || !isFinite(k)) return "—";
                var r = Math.round(k * 1000) / 1000;
                return String(r);
            }
            function addDaysISO(iso, days) {
                var p = iso.split("-").map(Number);
                var dt = new Date(Date.UTC(p[0], p[1] - 1, p[2] + days));
                var m = String(dt.getUTCMonth() + 1).padStart(2, "0");
                var d = String(dt.getUTCDate()).padStart(2, "0");
                return dt.getUTCFullYear() + "-" + m + "-" + d;
            }
            function formatWhen(date) {
                var zone = "America/New_York";
                var day = date.toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: zone });
                var time = date.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: zone, timeZoneName: "short" });
                return day + ", " + time;
            }
            function parseNasdaqAsOf(text) {
                var m = String(text || "").match(/AS OF\s+([A-Za-z]{3})\s+(\d{1,2}),\s+(\d{4})\s+(\d{1,2}):(\d{2})\s*(AM|PM)\s+ET/i);
                if (!m) return null;
                var months = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
                var month = months[m[1].toLowerCase()];
                if (month == null) return null;
                var hour = Number(m[4]) % 12;
                if (m[6].toUpperCase() === "PM") hour += 12;
                var iso = m[3] + "-" + String(month + 1).padStart(2, "0") + "-" + String(Number(m[2])).padStart(2, "0") + "T" + String(hour).padStart(2, "0") + ":" + m[5] + ":00";
                return zonedTime(iso, "America/New_York");
            }
            function zonedTime(iso, timeZone) {
                var bits = iso.split("T");
                var date = bits[0].split("-").map(Number);
                var clock = bits[1].split(":").map(Number);
                var utc = Date.UTC(date[0], date[1] - 1, date[2], clock[0], clock[1] || 0, clock[2] || 0);
                var fmt = new Intl.DateTimeFormat("en-US", {
                    timeZone: timeZone, hourCycle: "h23",
                    year: "numeric", month: "2-digit", day: "2-digit",
                    hour: "2-digit", minute: "2-digit", second: "2-digit"
                });
                var parts = {};
                fmt.formatToParts(new Date(utc)).forEach(function (p) { parts[p.type] = p.value; });
                var shown = Date.UTC(+parts.year, +parts.month - 1, +parts.day, (+parts.hour) % 24, +parts.minute, +parts.second);
                return new Date(utc - (shown - utc));
            }
            function aggregate(snapshot, expiry) {
                var profile = expiry ? (snapshot.byExpiry && snapshot.byExpiry[expiry]) : snapshot.combined;
                if (!profile || !profile.strikes) return { net: 0, strikes: new Map(), callWall: null, putWall: null, count: 0 };
                return profile;
            }
            function intervalById(id) {
                for (var i = 0; i < INTERVALS.length; i++) if (INTERVALS[i].id === id) return INTERVALS[i];
                return INTERVALS[0];
            }
            function nyToday() {
                return new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
            }
            function readStore() {
                try { return JSON.parse(localStorage.getItem(STORE)) || {}; }
                catch (e) { return {}; }
            }
            function writeStore(data) {
                try {
                    localStorage.setItem(STORE, JSON.stringify(data));
                } catch (e) {
                    var slim = {};
                    Object.keys(data).forEach(function (k) {
                        slim[k] = { savedAt: data[k].savedAt, snapshot: data[k].snapshot, series: {}, chainError: data[k].chainError };
                    });
                    try { localStorage.setItem(STORE, JSON.stringify(slim)); } catch (err) {}
                }
            }
            function packProfile(profile) {
                if (!profile || !profile.strikes) return null;
                return {
                    count: profile.count,
                    net: profile.net,
                    callWall: profile.callWall,
                    putWall: profile.putWall,
                    strikes: Array.from(profile.strikes.entries())
                };
            }
            function unpackProfile(profile) {
                if (!profile) return { count: 0, net: 0, callWall: null, putWall: null, strikes: new Map() };
                return {
                    count: profile.count || 0,
                    net: profile.net || 0,
                    callWall: profile.callWall == null ? null : profile.callWall,
                    putWall: profile.putWall == null ? null : profile.putWall,
                    strikes: new Map(profile.strikes || [])
                };
            }
            function packExpiryMap(byExpiry) {
                var out = {};
                Object.keys(byExpiry || {}).forEach(function (exp) { out[exp] = packProfile(byExpiry[exp]); });
                return out;

                    chart.priceManual = true;
                }
                canvas.onwheel = function (e) {
                    e.preventDefault();
                    var pt = localPoint(e);
                    if (onPriceScale(pt)) {
                        var anchor = priceAt(pt.y);
                        var frac = (geom.bottom - pt.y) / Math.max(1, geom.bottom - geom.top);
                        var span = geom.max - geom.min;
                        var next = span * (e.deltaY > 0 ? 1.12 : 0.88);
                        setPrice(anchor - frac * next, anchor + (1 - frac) * next);
                    } else {
                        var left = geom.left, right = geom.right;
                        var fracT = Math.min(1, Math.max(0, (pt.x - left) / Math.max(1, right - left)));
                        var spanT = chart.end - chart.start;
                        var nextT = Math.max(12, Math.min(bars.length + 5, spanT * (e.deltaY > 0 ? 1.18 : 0.82)));
                        var anchorT = chart.start + fracT * spanT;
                        chart.start = anchorT - fracT * nextT;
                        chart.end = chart.start + nextT;
                    }
                    draw();
                };
                canvas.onpointerdown = function (e) {
                    var pt = localPoint(e);
                    if (onPriceScale(pt)) {
                        var frac = (pt.y - geom.top) / Math.max(1, geom.bottom - geom.top);
                        drag = { kind: "scale", y: pt.y, min: geom.min, max: geom.max, anchor: priceAt(pt.y), frac: frac };
                        canvas.style.cursor = "ns-resize";
                    } else {
                        drag = { kind: "pan", x: e.clientX, y: pt.y, start: chart.start, end: chart.end, min: geom.min, max: geom.max };
                    }
                    canvas.setPointerCapture(e.pointerId);
                };
                canvas.onpointermove = function (e) {
                    var pt = localPoint(e);
                    hover = onPriceScale(pt) ? null : indexAt(e.clientX);
                    canvas.style.cursor = onPriceScale(pt) || (drag && drag.kind === "scale") ? "ns-resize" : "crosshair";
                    if (drag && drag.kind === "scale") {
                        var plotH = Math.max(1, geom.bottom - geom.top);
                        var factor = Math.exp((pt.y - drag.y) / (plotH * 0.72));
                        var span = (drag.max - drag.min) * factor;
                        var anchor = drag.anchor;
                        setPrice(anchor - (1 - drag.frac) * span, anchor + drag.frac * span);
                    } else if (drag && drag.kind === "pan") {
                        var slot = (geom.right - geom.left) / Math.max(1, drag.end - drag.start);
                        var shift = (drag.x - e.clientX) / Math.max(1, slot);
                        var spanT = drag.end - drag.start;
                        chart.start = drag.start + shift;
                        chart.end = chart.start + spanT;
                        var plotH = Math.max(1, geom.bottom - geom.top);
                        var priceShift = (pt.y - drag.y) / plotH * (drag.max - drag.min);
                        setPrice(drag.min + priceShift, drag.max + priceShift);
                    }
                    draw();
                };
                canvas.onpointerup = function () { drag = null; };
                canvas.onlostpointercapture = function () { drag = null; };
                canvas.onpointerleave = function () {
                    if (drag) return;
                    hover = null;
                    canvas.style.cursor = "crosshair";
                    draw();
                };
                canvas.ondblclick = function (e) {
                    var pt = localPoint(e);
                    chart.priceManual = false;
                    if (!onPriceScale(pt)) {
                        var win = defaultWindow(bars.length);
                        chart.start = win.start;
                        chart.end = win.end;
                    }
                    draw();
                };
                chartDraw = draw;
                draw();
            }

            document.getElementById("app").addEventListener("click", function (e) {
                var el = e.target.closest("[data-act]");
                if (!el) return;
                var act = el.getAttribute("data-act");
                if (act === "refresh") refreshAll(true);
                if (act === "open") {
                    state.selected = el.getAttribute("data-sym");
                    state.expiry = null;
                    render({ keepSide: true });
                }
                if (act === "ladder") {
                    state.selected = el.getAttribute("data-sym");
                    state.ladder = state.selected;
                    state.ladderExpiry = "";
                    render({ keepSide: true, keepMain: true });
                    var ladderItem = state.cache[state.ladder];
                    if (!ladderItem || !ladderItem.snapshot || !hasGamma(ladderItem.snapshot)) loadSymbol(state.ladder);
                }
                if (act === "ladder-close") {
                    var overlay = document.getElementById("ladderOverlay");
                    if (el === overlay && e.target !== overlay) return;
                    state.ladder = null;
                    render({ keepSide: true, keepMain: true });
                }
                if (act === "ladder-exp") {
                    state.ladderExpiry = el.getAttribute("data-exp") || "";
                    renderLadder();
                }
                if (act === "remove") {
                    var symRemove = el.getAttribute("data-sym");
                    var removedCurrent = state.selected === symRemove;
                    state.symbols = state.symbols.filter(function (s) { return s !== symRemove; });
                    delete state.cache[symRemove];
                    if (state.ladder === symRemove) state.ladder = null;
                    if (removedCurrent) state.selected = state.symbols[0] || null;
                    saveSymbols();
                    render({ keepSide: true, keepMain: !removedCurrent });
                }
                if (act === "menu") {
                    var menu = document.getElementById("expMenu");
                    if (menu) menu.hidden = !menu.hidden;
                }
                if (act === "expiry") {
                    state.expiry = el.getAttribute("data-exp") || null;
                    render({ keepSide: true, keepMain: true });
                }
                if (act === "depth") {
                    state.depth = Number(el.getAttribute("data-n"));
                    render({ keepSide: true, keepMain: true });
                }
                if (act === "interval") {
                    var iv = el.getAttribute("data-iv");
                    if (!iv || iv === state.interval || !state.selected) return;
                    state.interval = iv;
                    chart.key = "";
                    ensureSeries(state.selected, iv);
                }
            });
            document.getElementById("app").addEventListener("submit", function (e) {
                if (e.target.id !== "addForm") return;
                e.preventDefault();
                var input = document.getElementById("addInput");
                var symbol = input.value.trim().toUpperCase();
                if (!validSymbol(symbol) || state.symbols.indexOf(symbol) !== -1 || state.symbols.length >= MAX) return;
                state.symbols.push(symbol);
                saveSymbols();
                loadSymbol(symbol);
            });
            document.addEventListener("click", function (e) {
                var menu = document.getElementById("expMenu");
                if (!menu || menu.hidden) return;
                if (!e.target.closest(".expiry")) menu.hidden = true;
            });
            window.addEventListener("resize", function () { chartDraw(); });
            document.addEventListener("keydown", function (e) {
                if (e.key === "Escape" && state.ladder) {
                    state.ladder = null;
                    render({ keepSide: true, keepMain: true });
                }
            });
            setInterval(function () {
                var age = document.getElementById("ladderAge");
                var item = state.ladder && state.cache[state.ladder];
                if (age && item && item.snapshot && item.snapshot.gexTime) age.textContent = formatAge(item.snapshot.gexTime);
            }, 30000);

            hydrate();
            render();
            refreshAll();
        })();
    </script>
</body>
</html>
