name: Update futures prices

on:
  schedule:
    # After weekday CME settlements (equity index 16:00 ET, crude 14:30 ET).
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch delayed futures quotes
        run: python3 scripts/fetch_futures_prices.py

      - name: Commit price snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/data/futures-prices.json
          if git diff --staged --quiet; then
            echo "No price file changes."
            exit 0
          fi
          git commit -m "Update daily futures prices."
          git push
